name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter 版本（换版本重跑不用改代码）'
        required: false
        default: '3.44.0'
      force_agp_upgrade:
        description: '强制升级 AGP 到 9.1.1（试验用）'
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build Release APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Flutter 版本必须满足 pubspec.lock 里的约束：
      #   dart: ">=3.12.2 <4.0.0"
      # 注意：Flutter 3.44.0 自带的 Dart 只有 3.12.0，不满足 code_forge 10.9.0
      # 要求的 >=3.12.1，会报 version solving failed。
      # 3.50.0 自带的 Dart 已满足约束。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.44.0' }}
          channel: 'stable'
          cache: true

      # zstandard_android / jni / code_forge 等插件走 cargokit，需要 Rust 工具链
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      # 仓库里的 local.properties 是本机 Windows 路径，CI 上必须删除让 flutter 重新生成
      - name: Remove local.properties
        run: rm -f android/local.properties

      # 这些文件被 android/.gitignore 忽略，未上传时 CI 会直接失败，这里做自愈 + 明确报错
      - name: Verify / restore build prerequisites
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          cd android

          # gradle wrapper 被 android/.gitignore 忽略，若未提交则从模板工程补齐。
          # 注意：只补 gradlew 与 jar，绝不能用模板的 properties 覆盖仓库版本，
          # 否则会把仓库锁定的 gradle-9.3.1 覆盖成模板版本，导致与 AGP 8.11.1 错位。
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::warning::gradle wrapper missing, restoring from a temp flutter template"
            cd ..
            TMPDIR_W="$(mktemp -d)"
            flutter create --platforms=android --project-name=proxypin "$TMPDIR_W/_tmpl" > /dev/null
            cp -f "$TMPDIR_W/_tmpl/android/gradlew" android/ 2>/dev/null || true
            cp -f "$TMPDIR_W/_tmpl/android/gradlew.bat" android/ 2>/dev/null || true
            mkdir -p android/gradle/wrapper
            cp -f "$TMPDIR_W/_tmpl/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/ 2>/dev/null || true
            rm -rf "$TMPDIR_W"
            cd android
          fi
          chmod +x gradlew
          echo "---- gradle wrapper version ----"
          cat gradle/wrapper/gradle-wrapper.properties

          # key.properties 被 android/.gitignore 忽略，未入库时可用 Secrets 现场生成
          if [ ! -f key.properties ]; then
            if [ -n "${KEYSTORE_BASE64:-}" ]; then
              echo "key.properties 未入库，根据 Secrets 生成"
              printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=proxypin.keystore\n' \
                "${STORE_PASSWORD}" "${KEY_PASSWORD}" "${KEY_ALIAS}" > key.properties
            else
              echo "::error::缺少 android/key.properties。请强制提交它，或配置 Secrets：KEYSTORE_BASE64 / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
              exit 1
            fi
          fi

          # 注意：app/build.gradle 里 storeFile 用的是 file('proxypin.keystore')，
          # 基准是 android/app/ 而不是 android/。
          if [ ! -f app/proxypin.keystore ]; then
            if [ -n "${KEYSTORE_BASE64:-}" ]; then
              echo "keystore 未入库，根据 Secrets 解码到 android/app/"
              echo "$KEYSTORE_BASE64" | base64 -d > app/proxypin.keystore
            else
              echo "::error::缺少 android/app/proxypin.keystore。请强制提交：git add -f android/app/proxypin.keystore，或配置 Secrets：KEYSTORE_BASE64"
              exit 1
            fi
          fi
          test -s app/proxypin.keystore || { echo "::error::keystore 为空或解码失败"; exit 1; }

          echo "---- key.properties ----"
          cat key.properties
          echo "---- keystore ----"
          ls -l app/proxypin.keystore

      # android/build.gradle 对所有子工程硬编码 ndkVersion 28.2.13676358，
      # 缺这个 NDK 会直接 NDK not configured。sdkmanager 失败时退出码可能仍为 0，必须 test -d 校验。
      - name: Install Android NDK 28.2.13676358
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;28.2.13676358" \
            "platforms;android-36" \
            "build-tools;35.0.0"
          test -d "$SDK/ndk/28.2.13676358" || { echo "::error::NDK 28.2.13676358 安装失败"; exit 1; }
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Verify MCP binds to all interfaces
        run: |
          echo "---- MCP bind logic ----"
          grep -n "InternetAddress.anyIPv4\|InternetAddress.loopbackIPv4" \
            lib/network/mcp/mcp_server.dart
          if grep -q "Platform.isAndroid ? io.InternetAddress.loopbackIPv4" \
            lib/network/mcp/mcp_server.dart; then
            echo "ERROR: still hardcoded to loopback on Android"
            exit 1
          fi
          echo "OK: MCP is bound to 0.0.0.0"

      # 优先严格按 pubspec.lock 安装，保证可复现；
      # 若 lock 与当前 SDK 不兼容则回退到普通解析，避免因版本漂移直接失败。
      - name: Flutter pub get
        run: |
          flutter pub get --enforce-lockfile || {
            echo "::warning::--enforce-lockfile 失败，回退到普通 pub get"
            flutter pub get
          }
          flutter pub deps --style=compact | head -n 20 || true

      # settings.gradle 里有 assert flutter.sdk != null，缺这行会直接中断构建。
      # 优先用 FLUTTER_ROOT，回退到 command -v，并解析符号链接。
      - name: Ensure local.properties
        run: |
          set -euo pipefail
          FLUTTER_SDK="$(readlink -f "${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}")"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -x "$FLUTTER_SDK/bin/flutter" || { echo "::error::flutter.sdk 探测失败: $FLUTTER_SDK"; exit 1; }
          {
            echo "flutter.sdk=$FLUTTER_SDK"
            echo "sdk.dir=$SDK"
          } > android/local.properties
          cat android/local.properties

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # 关键：不要升 AGP。
      # Flutter 3.50 + AGP 8.11.1 会报 ApplicationExtension.getDefaultConfig() 不兼容，
      # 而升 AGP 9 需要连带重写大量构建脚本，风险更高。
      #
      # 所以锁定原作者验证过的组合：Flutter 3.44.0 + AGP 8.11.1 + Gradle 9.3.1，
      # 并用 GitHub 报错里给出的官方建议解决 Dart 约束冲突：
      #   code_forge >=10.5.0 要求 Dart >=3.12.1，而 Flutter 3.44.0 只有 Dart 3.12.0
      #   -> 降级到 ^10.4.1
      - name: Adjust deps for Flutter 3.44
        run: |
          set -euo pipefail
          echo "---- pubspec before ----"
          grep -n "code_forge" pubspec.yaml || true

          sed -i "s|code_forge: \^10\.[0-9.]*|code_forge: ^10.4.1|" pubspec.yaml

          echo "---- pubspec after ----"
          grep -n "code_forge" pubspec.yaml || true

          # 旧 lock 锁的是 code_forge 10.9.0（要求 Dart >=3.12.2），与新约束冲突，
          # 删掉让 pub 按新约束重新解析。
          rm -f pubspec.lock

          echo "---- agp/gradle (保持不动) ----"
          grep -n "com.android.application" android/settings.gradle
          grep -n "distributionUrl" android/gradle/wrapper/gradle-wrapper.properties

      # 本仓库 libapp.so / libflutter.so 只提供 arm64-v8a，
      # 其他 ABI 缺少产物会导致构建失败，所以必须指定 target-platform。
      #
      # --android-skip-build-dependency-validation：
      #   关掉 Flutter 对 AGP/Gradle 最低版本的硬校验。
      #   本项目锁定 AGP 8.11.1 + Gradle 9.3.1（原作者验证过的组合），
      #   这个参数只跳过版本门槛检查，不影响实际编译。
      - name: Build release APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --android-skip-build-dependency-validation

      - name: Show output
        run: |
          ls -lh build/app/outputs/flutter-apk/ || true
          ls -lh build/app/outputs/apk/release/ || true

      # android/build.gradle 把 rootProject.buildDir 改成了 ../build，
      # 所以产物在 <仓库根>/build/app/outputs/，不是 android/app/build/。
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProxyBird-arm64-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload mapping (if minified)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 7
